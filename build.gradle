plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
//    maven{url = "https://repo.essential.gg/repository/maven-public"}

    maven {
        // Location of the maven that hosts Team Resourceful's jars.
        name = "Team Resourceful Maven"
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }
}

dependencies {
    compileOnly "com.terraformersmc:modmenu:20.0.3"
    runtimeOnly "com.terraformersmc:modmenu:20.0.3"
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

//    implementation(include("gg.essential:vigilance:$vigilanceVersion"))
//    modImplementation(include("gg.essential:universalcraft-1.21.3-fabric:$ucVersion"))
//    implementation(include("gg.essential:elementa:$elementaVersion"))

    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.2:${project.resourceful_config_version}"
    include "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.2:${project.resourceful_config_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    // The English JSON is also the fallback for pure Java goal/statistics tools.
    doLast {
        def values = new Properties()
        values.putAll(new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/evoassist/lang/en_us.json')))
        def buffer = new StringWriter()
        values.store(buffer, null)
        file("${destinationDir}/evoassist-english.properties").setText(
                buffer.toString().readLines().findAll { !it.startsWith('#') }.join('\n') + '\n', 'UTF-8')
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

// These checks exercise parsing and persistence without starting Minecraft.
def compileRewardChecks = tasks.register('compileRewardChecks', JavaCompile) {
    source = fileTree('checks') { include '**/*.java' }
    classpath = sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('classes/rewardChecks')
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

tasks.register('checkRewardStatistics', JavaExec) {
    dependsOn compileRewardChecks
    classpath = files(sourceSets.main.output, compileRewardChecks.flatMap { it.destinationDirectory })
    mainClass = 'com.konzy.evo_assist.client.features.rewards.RewardStatisticsChecks'
    args layout.buildDirectory.dir('rewardChecks').get().asFile.absolutePath
}

tasks.named('check') { dependsOn 'checkRewardStatistics' }

tasks.register('checkAdditionalGoals', JavaExec) {
    dependsOn compileRewardChecks
    classpath = files(sourceSets.main.output, compileRewardChecks.flatMap { it.destinationDirectory })
    mainClass = 'com.konzy.evo_assist.client.features.goals.AdditionalGoalsChecks'
    args layout.buildDirectory.dir('goalChecks').get().asFile.absolutePath
}

tasks.named('check') { dependsOn 'checkAdditionalGoals' }

tasks.register('checkChatTabsLayout', JavaExec) {
    dependsOn compileRewardChecks
    classpath = files(sourceSets.main.output, compileRewardChecks.flatMap { it.destinationDirectory })
    mainClass = 'com.konzy.evo_assist.client.chat.ChatTabsLayoutChecks'
}

tasks.named('check') { dependsOn 'checkChatTabsLayout' }

tasks.register('checkLocalization', JavaExec) {
    dependsOn compileRewardChecks
    classpath = files(sourceSets.main.output, compileRewardChecks.flatMap { it.destinationDirectory })
    mainClass = 'com.konzy.evo_assist.client.util.LocalizationChecks'
}

tasks.named('check') { dependsOn 'checkLocalization' }

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
